<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아날로그 비주얼 포모도로 타이머</title>
  <style>
    /* ========================================================
       1. 기본 스타일 및 레이아웃 설정
       ======================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* 드래그 조작 중 텍스트 선택 방지 */
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
      color: #333333;
    }

    /* 전체 애플리케이션 컨테이너 */
    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* 제목 영역 */
    .header-title {
      font-size: 24px;
      font-weight: 700;
      color: #2c3e50;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .header-subtitle {
      font-size: 14px;
      color: #6c757d;
      margin-top: 4px;
      text-align: center;
    }

    /* ========================================================
       2. 실물 비주얼 타이머 본체 (하드웨어 케이스 디자인)
       ======================================================== */
    /* 외곽 검정 테두리 + 두꺼운 사각 화이트 베젤 */
    .timer-hardware {
      width: 380px;
      height: 380px;
      background: #ffffff;
      /* 부드럽게 둥근 모서리와 실물 특유의 입체 테두리 */
      border-radius: 48px;
      border: 5px solid #202020;
      box-shadow: 
        0 18px 40px rgba(0, 0, 0, 0.18),
        inset 0 4px 10px rgba(255, 255, 255, 0.9),
        inset 0 -6px 12px rgba(0, 0, 0, 0.08);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* 시계판 내부 안쪽 영역 (다이얼이 위치하는 사각/원형 베이스) */
    .dial-face {
      width: 100%;
      height: 100%;
      background: #fbfbfb;
      border-radius: 28px;
      border: 1px solid #e5e5e5;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* SVG 다이얼 그래픽 캔버스 */
    .dial-svg {
      width: 320px;
      height: 320px;
      touch-action: none; /* 모바일 터치 드래그 지원 */
      cursor: grab;
    }

    .dial-svg:active {
      cursor: grabbing;
    }

    /* 좌측 하단 (60 Min) 배지 */
    .badge-60min {
      position: absolute;
      bottom: 12px;
      left: 18px;
      font-size: 10.5px;
      font-weight: 700;
      color: #555555;
      border: 1.5px solid #777777;
      border-radius: 12px;
      padding: 1px 7px;
      background-color: rgba(255, 255, 255, 0.85);
      letter-spacing: -0.2px;
      pointer-events: none;
    }

    /* 우측 하단 로고 텍스트 (Tamsau 스타일) */
    .badge-brand {
      position: absolute;
      bottom: 10px;
      right: 18px;
      text-align: right;
      pointer-events: none;
    }

    .brand-main {
      font-size: 13px;
      font-weight: 900;
      color: #222222;
      letter-spacing: -0.3px;
      display: block;
    }

    .brand-sub {
      font-size: 7.5px;
      font-weight: 600;
      color: #777777;
      letter-spacing: 0.2px;
      text-transform: uppercase;
      display: block;
      margin-top: -1px;
    }

    /* ========================================================
       3. 중앙 컨트롤 노브(Knob) 디자인
       ======================================================== */
    .center-knob {
      cursor: grab;
      filter: drop-shadow(0px 6px 10px rgba(0, 0, 0, 0.25));
      transition: transform 0.05s ease-out;
    }

    .center-knob:active {
      cursor: grabbing;
    }

    /* ========================================================
       4. 하단 조작 패널 및 디지털 디스플레이
       ======================================================== */
    .control-panel {
      width: 380px;
      background: #ffffff;
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 남은 시간 디지털 표시 및 상태 배지 */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1f3f5;
      padding-bottom: 12px;
    }

    .digital-time {
      font-size: 32px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #e62817;
      letter-spacing: 1px;
    }

    .timer-state-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      background: #f1f3f5;
      color: #495057;
    }

    .timer-state-badge.running {
      background: #ffe3e3;
      color: #e03131;
    }

    /* 시작 / 정지 / 초기화 액션 버튼 그룹 */
    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      height: 44px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #e62817;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(230, 40, 23, 0.3);
    }

    .btn-primary:hover {
      background: #cf2213;
    }

    .btn-secondary {
      background: #f1f3f5;
      color: #495057;
    }

    .btn-secondary:hover {
      background: #e9ecef;
    }

    /* 프리셋(빠른 설정) 버튼 그룹 */
    .preset-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .preset-label {
      font-size: 12px;
      font-weight: 600;
      color: #868e96;
    }

    .preset-buttons {
      display: flex;
      gap: 6px;
    }

    .btn-preset {
      flex: 1;
      padding: 8px 4px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #495057;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-preset:hover {
      background: #e9ecef;
      color: #212529;
    }

    .btn-preset.active {
      background: #343a40;
      color: #ffffff;
      border-color: #343a40;
    }

    /* 옵션 토글 (사운드 알림 on/off) */
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
      font-size: 13px;
      color: #6c757d;
    }

    .sound-toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .sound-checkbox {
      accent-color: #e62817;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* 사용 안내 도움말 */
    .guide-tip {
      font-size: 12px;
      color: #868e96;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 헤더 타이틀 -->
    <div>
      <h1 class="header-title">Visual Pomodoro Timer</h1>
      <p class="header-subtitle">노브를 마우스로 직접 돌리거나 프리셋을 눌러 시간을 설정하세요</p>
    </div>

    <!-- 실물 포모도로 타이머 하드웨어 본체 -->
    <div class="timer-hardware">
      <div class="dial-face" id="dialFace">
        
        <!-- SVG 다이얼 (부채꼴 디스크, 눈금, 숫자, 노브 렌더링) -->
        <svg class="dial-svg" id="dialSvg" viewBox="0 0 320 320">
          <defs>
            <!-- 톱니바퀴 노브 테두리 패턴 필터 (입체감 부여) -->
            <filter id="knobShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.25"/>
            </filter>
            <!-- 화살표 마커 -->
            <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 8 5 L 0 9 z" fill="#333333" />
            </marker>
          </defs>

          <!-- 1. 배경 바탕 원 -->
          <circle cx="160" cy="160" r="145" fill="#fdfdfd" stroke="#e0e0e0" stroke-width="1.5"/>

          <!-- 2. 시각적 잔여 시간 붉은색 디스크 (부채꼴) -->
          <path id="redDisk" d="" fill="#e62817" />

          <!-- 3. 시계 눈금 및 숫자 레이어 (동적 생성) -->
          <g id="dialTicks"></g>
          <g id="dialNumbers"></g>

          <!-- 4. 실물 0 -> 5 화살표 표기 -->
          <path d="M 168 28 C 176 28, 185 30, 192 34" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />

          <!-- 5. 중앙 회전 노브 (Knob) 레이어 -->
          <g id="centerKnobGroup" class="center-knob">
            <!-- 톱니바퀴 널링(Knurled) 기어 배경 -->
            <g id="knobTeeth"></g>
            <!-- 노브 본체 둥근 캡 -->
            <circle cx="160" cy="160" r="40" fill="#f7f7f7" stroke="#e0e0e0" stroke-width="2" filter="url(#knobShadow)" />
            <circle cx="160" cy="160" r="32" fill="#ffffff" stroke="#ececec" stroke-width="1" />
            <!-- 노브 중앙 미세 홈 인디케이터 (현재 회전 각도를 직관적으로 표시) -->
            <circle cx="160" cy="128" r="3" fill="#cfd4da" />
          </g>
        </svg>

        <!-- 디테일: 좌측 하단 (60 Min) 배지 -->
        <div class="badge-60min">60 Min</div>

        <!-- 디테일: 우측 하단 브랜드 로고 -->
        <div class="badge-brand">
          <span class="brand-main">POMODORO</span>
          <span class="brand-sub">Visual Timer</span>
        </div>

      </div>
    </div>

    <!-- 하단 조작 컨트롤 패널 -->
    <div class="control-panel">
      <!-- 디지털 잔여 시간 표시 및 상태 -->
      <div class="status-row">
        <div>
          <span style="font-size: 11px; font-weight: 700; color: #868e96; text-transform: uppercase;">남은 시간</span>
          <div class="digital-time" id="digitalDisplay">00:00</div>
        </div>
        <div class="timer-state-badge" id="stateBadge">대기 중</div>
      </div>

      <!-- 제어 버튼 (시작/정지, 리셋) -->
      <div class="action-buttons">
        <button class="btn btn-primary" id="btnToggle">
          <span id="btnToggleIcon">▶</span>
          <span id="btnToggleText">시작</span>
        </button>
        <button class="btn btn-secondary" id="btnReset">
          <span>↺</span>
          <span>초기화</span>
        </button>
      </div>

      <!-- 빠른 시간 설정 프리셋 -->
      <div class="preset-group">
        <div class="preset-label">빠른 시간 설정</div>
        <div class="preset-buttons">
          <button class="btn-preset" data-minutes="25">25분 (집중)</button>
          <button class="btn-preset" data-minutes="5">5분 (휴식)</button>
          <button class="btn-preset" data-minutes="15">15분 (긴 휴식)</button>
          <button class="btn-preset" data-minutes="40">40분 (이미지)</button>
        </div>
      </div>

      <!-- 사운드 알림 옵션 -->
      <div class="options-row">
        <label class="sound-toggle-label">
          <input type="checkbox" class="sound-checkbox" id="soundToggle" checked>
          <span>종료 시 비프음 알람 울림</span>
        </label>
        <label class="sound-toggle-label">
          <input type="checkbox" class="sound-checkbox" id="tickSoundToggle">
          <span>째깍째깍 초침 소리</span>
        </label>
      </div>

      <!-- 안내 팁 -->
      <div class="guide-tip">
        💡 타이머 시계판이나 중앙 손잡이를 <strong>마우스로 클릭한 채 드래그</strong>하면 원하는 분으로 자유롭게 맞출 수 있습니다.
      </div>
    </div>
  </div>

  <!-- ========================================================
       5. 타이머 인터랙션 및 로직 스크립트 (상세 한국어 주석 포함)
       ======================================================== -->
  <script>
    // ----------------------------------------------------
    // [A] 전역 상태 변수 관리
    // ----------------------------------------------------
    const TOTAL_SECONDS_MAX = 3600; // 최대 60분 (3600초)
    let remainingSeconds = 0;       // 현재 남은 초 단위 시간
    let totalDurationSeconds = 0;   // 사용자가 설정했던 전체 시간 (초)
    let timerInterval = null;       // setInterval 참조 식별자
    let isRunning = false;          // 타이머 실행 여부 플래그
    let isDragging = false;         // 마우스/터치 드래그 상태 플래그

    // ----------------------------------------------------
    // [B] DOM 요소 선택
    // ----------------------------------------------------
    const dialSvg = document.getElementById('dialSvg');
    const redDisk = document.getElementById('redDisk');
    const dialTicks = document.getElementById('dialTicks');
    const dialNumbers = document.getElementById('dialNumbers');
    const knobTeeth = document.getElementById('knobTeeth');
    const centerKnobGroup = document.getElementById('centerKnobGroup');
    const digitalDisplay = document.getElementById('digitalDisplay');
    const stateBadge = document.getElementById('stateBadge');
    const btnToggle = document.getElementById('btnToggle');
    const btnToggleText = document.getElementById('btnToggleText');
    const btnToggleIcon = document.getElementById('btnToggleIcon');
    const btnReset = document.getElementById('btnReset');
    const soundToggle = document.getElementById('soundToggle');
    const tickSoundToggle = document.getElementById('tickSoundToggle');
    const presetButtons = document.querySelectorAll('.btn-preset');

    // ----------------------------------------------------
    // [C] 다이얼 시계판 초기 렌더링 (눈금, 숫자, 노브 톱니 생성)
    // ----------------------------------------------------
    const CENTER_X = 160;
    const CENTER_Y = 160;
    const DIAL_RADIUS = 145; // 외곽 테두리 반지름

    /**
     * 1) 0~59분 눈금선(Ticks) 60개 생성
     *    - 5분 단위: 굵고 긴 눈금
     *    - 1분 단위: 얇고 짧은 눈금
     */
    function renderDialTicks() {
      dialTicks.innerHTML = '';
      for (let i = 0; i < 60; i++) {
        // 각도 계산: 12시 방향(0도)부터 시계 방향으로 6도씩 회전
        const angle = i * 6;
        const rad = (angle - 90) * (Math.PI / 180);

        const isMajor = (i % 5 === 0); // 5분 단위 여부
        const tickLength = isMajor ? 14 : 7;
        const tickWidth = isMajor ? 2.2 : 1.0;
        const tickColor = isMajor ? '#1a1a1a' : '#777777';

        // 바깥쪽 시작 좌표와 안쪽 끝 좌표 계산
        const rOuter = 135;
        const rInner = rOuter - tickLength;

        const x1 = CENTER_X + rOuter * Math.cos(rad);
        const y1 = CENTER_Y + rOuter * Math.sin(rad);
        const x2 = CENTER_X + rInner * Math.cos(rad);
        const y2 = CENTER_Y + rInner * Math.sin(rad);

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', tickColor);
        line.setAttribute('stroke-width', tickWidth);
        line.setAttribute('stroke-linecap', 'round');
        dialTicks.appendChild(line);
      }
    }

    /**
     * 2) 0, 5, 10, ..., 55 숫자 텍스트 배치
     */
    function renderDialNumbers() {
      dialNumbers.innerHTML = '';
      // 5분 간격 숫자 목록
      const numberValues = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];

      numberValues.forEach((num) => {
        // 0은 0도(12시), 5는 30도, 10은 60도...
        const angle = num * 6;
        const rad = (angle - 90) * (Math.PI / 180);
        const rText = 106; // 숫자가 놓일 반지름 위치

        const x = CENTER_X + rText * Math.cos(rad);
        const y = CENTER_Y + rText * Math.sin(rad);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x);
        text.setAttribute('y', y + 5.5); // 세로 중앙 정렬 보정
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '17');
        text.setAttribute('font-weight', '700');
        text.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif');
        text.setAttribute('fill', '#1a1a1a');
        text.textContent = num.toString();
        dialNumbers.appendChild(text);
      });
    }

    /**
     * 3) 중앙 노브 둘레의 톱니바퀴 홈(fluting) 생성
     */
    function renderKnobTeeth() {
      knobTeeth.innerHTML = '';
      const totalTeeth = 36; // 36개의 미세 톱니
      for (let i = 0; i < totalTeeth; i++) {
        const angle = (i * 360 / totalTeeth);
        const rad = angle * (Math.PI / 180);
        const r1 = 39;
        const r2 = 43;

        const x1 = CENTER_X + r1 * Math.cos(rad);
        const y1 = CENTER_Y + r1 * Math.sin(rad);
        const x2 = CENTER_X + r2 * Math.cos(rad);
        const y2 = CENTER_Y + r2 * Math.sin(rad);

        const tooth = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        tooth.setAttribute('x1', x1);
        tooth.setAttribute('y1', y1);
        tooth.setAttribute('x2', x2);
        tooth.setAttribute('y2', y2);
        tooth.setAttribute('stroke', '#d2d6dc');
        tooth.setAttribute('stroke-width', '2');
        tooth.setAttribute('stroke-linecap', 'round');
        knobTeeth.appendChild(tooth);
      }
    }

    // ----------------------------------------------------
    // [D] 붉은색 비주얼 디스크 (SVG 부채꼴 경로) 계산 및 갱신
    // ----------------------------------------------------
    /**
     * 남은 시간(초)에 따라 12시 방향부터 시계 방향으로 채워지는
     * 빨간색 부채꼴(Wedge) SVG 경로를 생성합니다.
     */
    function updateRedDiskVisual(seconds) {
      if (seconds <= 0) {
        redDisk.setAttribute('d', ''); // 0초면 부채꼴 사라짐
        return;
      }

      // 각도 계산: 3600초 = 360도
      let fraction = seconds / TOTAL_SECONDS_MAX;
      if (fraction > 1) fraction = 1;

      const angleDegrees = fraction * 360;

      // 60분(360도) 꽉 찬 원인 경우 예외 처리
      if (angleDegrees >= 359.99) {
        redDisk.setAttribute('d', `
          M ${CENTER_X} ${CENTER_Y}
          m 0 -${DIAL_RADIUS}
          a ${DIAL_RADIUS} ${DIAL_RADIUS} 0 1 1 0 ${DIAL_RADIUS * 2}
          a ${DIAL_RADIUS} ${DIAL_RADIUS} 0 1 1 0 -${DIAL_RADIUS * 2}
          Z
        `);
        return;
      }

      // 12시 방향 시작점
      const startX = CENTER_X;
      const startY = CENTER_Y - DIAL_RADIUS;

      // 끝나는 점 좌표 계산 (시계 방향 회전)
      const endRad = (angleDegrees - 90) * (Math.PI / 180);
      const endX = CENTER_X + DIAL_RADIUS * Math.cos(endRad);
      const endY = CENTER_Y + DIAL_RADIUS * Math.sin(endRad);

      // 각도가 180도를 넘어가면 large-arc-flag를 1로 설정
      const largeArcFlag = angleDegrees > 180 ? 1 : 0;

      // SVG Path 명령어: 중심(M) -> 12시로 직선(L) -> 호(A) -> 다시 중심으로 닫기(Z)
      const pathData = `
        M ${CENTER_X} ${CENTER_Y}
        L ${startX} ${startY}
        A ${DIAL_RADIUS} ${DIAL_RADIUS} 0 ${largeArcFlag} 1 ${endX} ${endY}
        Z
      `;
      redDisk.setAttribute('d', pathData);
    }

    /**
     * 중앙 노브 회전 각도 갱신
     */
    function updateKnobRotation(seconds) {
      const angle = (seconds / TOTAL_SECONDS_MAX) * 360;
      centerKnobGroup.setAttribute('transform', `rotate(${angle} ${CENTER_X} ${CENTER_Y})`);
    }

    /**
     * 디지털 시간 (MM:SS) 텍스트 갱신
     */
    function updateDigitalDisplay(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      digitalDisplay.textContent = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    /**
     * 전체 UI 동기화 함수
     */
    function renderTime(seconds) {
      updateRedDiskVisual(seconds);
      updateKnobRotation(seconds);
      updateDigitalDisplay(seconds);
    }

    // ----------------------------------------------------
    // [E] 사운드 효과음 (Web Audio API 브라우저 자체 합성)
    // ----------------------------------------------------
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    /**
     * 초침 째깍 소리 (선택 옵션)
     */
    function playTickSound() {
      if (!tickSoundToggle.checked) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, ctx.currentTime);

        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.03);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.03);
      } catch (e) {
        console.warn('오디오 재생 실패:', e);
      }
    }

    /**
     * 완료 알람 차임 벨소리 ("딩-동-댕-동!")
     */
    function playAlarmSound() {
      if (!soundToggle.checked) return;
      try {
        const ctx = getAudioContext();
        // 멜로디 주파수: C5, E5, G5, C6
        const melody = [523.25, 659.25, 783.99, 1046.50];
        
        melody.forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.16);

          const startTime = ctx.currentTime + index * 0.16;
          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.5);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(startTime);
          osc.stop(startTime + 0.5);
        });
      } catch (e) {
        console.warn('알람 재생 실패:', e);
      }
    }

    // ----------------------------------------------------
    // [F] 타이머 제어 함수 (시작, 정지, 리셋, 완료)
    // ----------------------------------------------------
    function startTimer() {
      if (remainingSeconds <= 0) return;

      isRunning = true;
      btnToggleText.textContent = '일시정지';
      btnToggleIcon.textContent = '⏸';
      btnToggle.classList.remove('btn-primary');
      btnToggle.classList.add('btn-secondary');

      stateBadge.textContent = '집중 진행 중';
      stateBadge.classList.add('running');

      // 1초 주기로 카운트다운 실행
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          renderTime(remainingSeconds);
          playTickSound();
        } else {
          // 타이머 시간 종료
          completeTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);

      btnToggleText.textContent = '계속 진행';
      btnToggleIcon.textContent = '▶';
      btnToggle.classList.remove('btn-secondary');
      btnToggle.classList.add('btn-primary');

      stateBadge.textContent = '일시 정지됨';
      stateBadge.classList.remove('running');
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = 0;
      totalDurationSeconds = 0;
      renderTime(0);

      btnToggleText.textContent = '시작';
      btnToggleIcon.textContent = '▶';
      stateBadge.textContent = '대기 중';

      presetButtons.forEach(btn => btn.classList.remove('active'));
    }

    function completeTimer() {
      pauseTimer();
      remainingSeconds = 0;
      renderTime(0);

      btnToggleText.textContent = '시작';
      btnToggleIcon.textContent = '▶';
      stateBadge.textContent = '시간 완료! 🎉';

      playAlarmSound();
      alert('⏰ 설정한 시간이 완료되었습니다! 수고하셨습니다.');
    }

    // ----------------------------------------------------
    // [G] 마우스 & 터치 드래그로 시간 설정 인터랙션
    // ----------------------------------------------------
    /**
     * 마우스/터치 위치로부터 12시 기준의 회전 각도를 계산하여 시간을 설정합니다.
     */
    function handlePointerPosition(clientX, clientY) {
      const rect = dialSvg.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const dx = clientX - centerX;
      const dy = clientY - centerY;

      // Math.atan2는 3시 방향이 0도이므로, 12시 방향을 0도로 맞추기 위해 보정
      let angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
      if (angle < 0) {
        angle += 360;
      }

      // 각도를 60분 체계(초 단위)로 환산
      let targetSeconds = Math.round((angle / 360) * TOTAL_SECONDS_MAX);

      // 분 단위로 깔끔하게 떨어지도록 1분(60초) 단위로 스냅
      targetSeconds = Math.round(targetSeconds / 60) * 60;

      // 0분 근처 처리: 회전 중 59분에서 0분으로 넘어갈 때의 안정적 처리
      if (targetSeconds > TOTAL_SECONDS_MAX) {
        targetSeconds = TOTAL_SECONDS_MAX;
      }

      setTimeFromInteraction(targetSeconds);
    }

    function setTimeFromInteraction(seconds) {
      pauseTimer(); // 조작 시 타이머 자동 일시정지
      remainingSeconds = seconds;
      totalDurationSeconds = seconds;
      renderTime(remainingSeconds);

      stateBadge.textContent = seconds > 0 ? '시간 설정됨' : '대기 중';
      btnToggleText.textContent = '시작';
      btnToggleIcon.textContent = '▶';
    }

    // 마우스 이벤트 등록
    dialSvg.addEventListener('mousedown', (e) => {
      isDragging = true;
      handlePointerPosition(e.clientX, e.clientY);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      handlePointerPosition(e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // 모바일 터치 이벤트 등록
    dialSvg.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        handlePointerPosition(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      e.preventDefault(); // 스크롤 방지
      handlePointerPosition(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchend', () => {
      isDragging = false;
    });

    // ----------------------------------------------------
    // [H] UI 버튼 이벤트 연결
    // ----------------------------------------------------
    // 시작 / 일시정지 버튼 토글
    btnToggle.addEventListener('click', () => {
      if (remainingSeconds <= 0) {
        // 시간이 0초일 때 시작 버튼을 누르면 기본 25분(포모도로)으로 자동 세팅
        setTimeFromInteraction(25 * 60);
        startTimer();
        return;
      }

      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    // 초기화 버튼
    btnReset.addEventListener('click', () => {
      resetTimer();
    });

    // 빠른 설정 프리셋 버튼
    presetButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        presetButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const minutes = parseInt(btn.getAttribute('data-minutes'), 10);
        setTimeFromInteraction(minutes * 60);
      });
    });

    // ----------------------------------------------------
    // [I] 초기화 실행
    // ----------------------------------------------------
    renderDialTicks();
    renderDialNumbers();
    renderKnobTeeth();

    // 사용자가 제공한 첨부 사진과 동일하게 기본 40분으로 시작 세팅
    setTimeFromInteraction(40 * 60);
  </script>
</body>
